apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab-test-app
  namespace: default
  labels:
    app: lab-test-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lab-test-app
  template:
    metadata:
      labels:
        app: lab-test-app
    spec:
      containers:
        - name: app
          image: zot.lab.example/lab/test-app:1.0.0
          ports:
            - containerPort: 8080
          env:
            - name: POSTGRES_HOST
              value: postgres.database.svc.cluster.local
            - name: KAFKA_BOOTSTRAP
              value: kafka.messaging.svc.cluster.local:9092
            - name: OPENSEARCH_URL
              value: http://opensearch.logging.svc.cluster.local:9200
            - name: MQTT_HOST
              value: emqx.messaging.svc.cluster.local
            - name: ENABLE_POSTGRES
              value: "true"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: lab-test-app
  namespace: default
spec:
  selector:
    app: lab-test-app
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lab-test-app
  namespace: default
  annotations:
    cert-manager.io/cluster-issuer: lab-ca-issuer
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - testapp.lab.example
      secretName: lab-test-app-tls
  rules:
    - host: testapp.lab.example
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: lab-test-app
                port:
                  number: 80
