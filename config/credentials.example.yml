---
# EXAMPLE credentials file — copy to credentials.yml (gitignored) for LAB use.
# LAB ONLY. Production must use Ansible Vault / centralized secret management.
#
# cp config/credentials.example.yml config/credentials.yml
# ansible-vault encrypt config/credentials.yml   # for non-LAB

lab_only: true
warning: >
  These credentials are intentionally weak for LAB convenience.
  Production MUST use strong credentials, MFA, bastion access,
  disabled root SSH, and audited administrative access.

lab_user:
  username: devops
  password: "password"

# Kubernetes bootstrap token is generated at deploy time; do not hardcode.
kubernetes:
  # admin.conf is generated by kubeadm — do not commit secrets
  bootstrap_token: ""

postgres:
  username: labuser
  password: "lab-postgres-password"
  database: labdb

grafana:
  admin_user: admin
  admin_password: "lab-grafana-password"

argocd:
  admin_password: "lab-argocd-password"

emqx:
  dashboard_user: admin
  dashboard_password: "lab-emqx-password"

opensearch:
  admin_password: "Lab-OpenSearch-Password1!"

registry:
  # LAB HTTP mode — production must use TLS and auth
  username: ""
  password: ""
  insecure: true
