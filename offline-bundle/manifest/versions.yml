---
# Pinned versions — offline deployment must never select newer versions dynamically.
# Update this file explicitly during Internet preparation, then regenerate the offline bundle.
# Status: LAB VERIFIED stack selection (compatible set). Not PRODUCTION READY certification.

bundle_version: "1.0.0"
rocky_linux: "9"
architecture: "x86_64"

kubernetes:
  version: "1.31.4"
  source: "https://pkgs.k8s.io/core:/stable:/v1.31/rpm/"
  notes: "Pinned stable 1.31.x compatible with containerd and Cilium"

containerd:
  version: "1.7.24"
  source: "https://github.com/containerd/containerd"
  notes: "CRI with systemd cgroup driver"

runc:
  version: "1.2.2"
  source: "https://github.com/opencontainers/runc"

cni_plugins:
  version: "1.6.0"
  source: "https://github.com/containernetworking/plugins"

cilium:
  version: "1.16.5"
  chart_version: "1.16.5"
  source: "https://helm.cilium.io/"
  notes: "Compatible with Kubernetes 1.31"

hubble:
  enabled_with: cilium
  ui_version: "0.13.1"

coredns:
  version: "1.11.3"
  notes: "Deployed as Kubernetes cluster DNS"

cert_manager:
  version: "1.16.2"
  chart_version: "v1.16.2"
  source: "https://charts.jetstack.io"

ingress_nginx:
  version: "1.11.3"
  chart_version: "4.11.3"
  source: "https://kubernetes.github.io/ingress-nginx"

istio:
  version: "1.23.3"
  source: "https://istio.io/latest/docs/setup/install/"

argocd:
  version: "2.13.2"
  chart_version: "7.7.8"
  source: "https://argoproj.github.io/argo-helm"

postgres:
  version: "16.4.0"
  chart_version: "16.4.0"
  image: "bitnami/postgresql:16.4.0"
  source: "https://charts.bitnami.com/bitnami"

kafka:
  version: "3.8.0"
  chart_version: "30.1.4"
  mode: kraft
  source: "https://charts.bitnami.com/bitnami"

opensearch:
  version: "2.17.1"
  chart_version: "2.27.0"
  source: "https://opensearch-project.github.io/helm-charts/"

emqx:
  version: "5.8.3"
  chart_version: "5.8.3"
  source: "https://repos.emqx.io/charts"

prometheus:
  version: "2.54.1"
  chart_version: "66.2.1"
  source: "https://prometheus-community.github.io/helm-charts"
  stack: kube-prometheus-stack

grafana:
  version: "11.3.0"
  notes: "Bundled with kube-prometheus-stack in LAB"

loki:
  version: "3.2.0"
  chart_version: "6.18.0"
  source: "https://grafana.github.io/helm-charts"

opentelemetry:
  version: "0.112.0"
  chart_version: "0.68.1"
  source: "https://open-telemetry.github.io/opentelemetry-helm-charts"

rook_ceph:
  version: "1.15.3"
  chart_version: "v1.15.3"
  source: "https://charts.rook.io/release"

trivy:
  version: "0.57.1"
  chart_version: "0.25.0"
  source: "https://aquasecurity.github.io/helm-charts/"

zot:
  version: "2.1.1"
  source: "https://github.com/project-zot/zot"

helm:
  version: "3.16.3"
  source: "https://get.helm.sh"

kubectl:
  version: "1.31.4"
  notes: "Aligned with Kubernetes cluster version"

local_path_provisioner:
  version: "0.0.30"
  source: "https://github.com/rancher/local-path-provisioner"

nginx:
  version: "1.26.2"
  notes: "Serves offline RPM and Helm repositories on OPS"

dnsmasq:
  version: "2.85"
  notes: "LAB DNS on OPS node"

pause_image:
  version: "3.10"
  repository: "registry.k8s.io/pause"

compatibility:
  rocky_linux: "9"
  kubernetes_containerd: "validated for 1.31.x / containerd 1.7.x"
  kubernetes_cilium: "validated for 1.31.x / Cilium 1.16.x"
  status: LAB_VERIFIED
