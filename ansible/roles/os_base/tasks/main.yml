---
- name: Ensure chrony installed for time sync
  ansible.builtin.dnf:
    name: chrony
    state: present
  when: not (offline_mode | default(false))

- name: Enable chronyd
  ansible.builtin.service:
    name: chronyd
    state: started
    enabled: true
  failed_when: false

- name: Load required kernel modules
  community.general.modprobe:
    name: "{{ item }}"
    state: present
  loop:
    - overlay
    - br_netfilter
  failed_when: false

- name: Persist kernel modules
  ansible.builtin.copy:
    dest: /etc/modules-load.d/k8s.conf
    content: |
      overlay
      br_netfilter
    mode: "0644"

- name: Sysctl for Kubernetes networking
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_set: true
    state: present
    reload: true
  loop:
    - {key: net.bridge.bridge-nf-call-iptables, value: "1"}
    - {key: net.bridge.bridge-nf-call-ip6tables, value: "1"}
    - {key: net.ipv4.ip_forward, value: "1"}

- name: Disable swap
  ansible.builtin.command: swapoff -a
  changed_when: false
  failed_when: false

- name: Ensure hostname is FQDN
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"
