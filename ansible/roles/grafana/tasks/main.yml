---
- name: Grafana managed via kube-prometheus-stack when prometheus enabled
  ansible.builtin.debug:
    msg: "Grafana ingress host is DNS name {{ service_fqdns.grafana }}"

- name: Standalone Grafana if prometheus disabled but grafana enabled
  ansible.builtin.command: >
    helm upgrade --install grafana grafana/grafana
    --namespace monitoring
    --create-namespace
    --set image.repository={{ zot_fqdn }}/docker.io/grafana/grafana
    --set ingress.enabled=true
    --set ingress.hosts[0]={{ service_fqdns.grafana }}
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  when: not (components.prometheus | default(false))
  failed_when: false
